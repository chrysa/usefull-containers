services:
  api:
    build:
      context: ./backend
      target: production
    environment:
      BLUEPRINTS_DIR: /tmp/blueprints
      CORS_ORIGINS: '["http://frontend:4173", "http://localhost:9109"]'
      # E2E hammers /auth/register + /login from a single IP across many specs;
      # the suite isn't testing rate limiting (backend unit tests cover A-08),
      # so lift the cap to avoid spurious 429s.
      AUTH_RATE_LIMIT_MAX: "100000"
    healthcheck:
      interval: 5s
      retries: 12
      start_period: 10s
      # NOTE: keep this 2-element form so pre-commit yaml-sorter cannot reorder
      # the CMD prefix out of position. Single-string form is treated as
      # CMD-SHELL by Docker.
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      timeout: 5s
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        # The SPA calls the API cross-origin (no proxy since the nginx->vite
        # preview switch). In the compose network the browser runs inside the
        # playwright container, so the backend is reachable by service name.
        # Without this, VITE_API_URL is empty and the client falls back to a
        # relative "/api", which vite preview answers with 404.
        VITE_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
  playwright:
    command: "sh -c \"npm ci &&\n       timeout 90 sh -c 'until curl -sf http://frontend:4173\
      \ > /dev/null; do sleep 2; done' &&\n       npx playwright test\"\n"
    depends_on:
    - frontend
    environment:
      BASE_URL: http://frontend:4173
      CI: 'true'
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    volumes:
    - ./test-results:/e2e/test-results
    - ./tests/e2e:/e2e
    working_dir: /e2e
