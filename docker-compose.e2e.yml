services:
  # IMPORTANT: service MUST be named "backend" — hardcoded in frontend/nginx.conf
  # as: proxy_pass http://backend:8000/api/
  backend:
    build:
      context: ./backend
      target: production
    environment:
      BLUEPRINTS_DIR: /tmp/blueprints
      CORS_ORIGINS: '["http://frontend:80", "http://localhost:9109"]'
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      target: production
    depends_on:
      backend:
        condition: service_healthy

  playwright:
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    working_dir: /e2e
    volumes:
      - ./tests/e2e:/e2e
      - ./test-results:/e2e/test-results
    environment:
      BASE_URL: "http://frontend:80"
      CI: "true"
    depends_on:
      - frontend
    command: >
      sh -c "npm ci &&
             timeout 90 sh -c 'until curl -sf http://frontend:80 > /dev/null; do sleep 2; done' &&
             npx playwright test"
