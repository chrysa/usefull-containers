services:
  backend:
    build:
      context: ./backend
      target: production
    environment:
      BLUEPRINTS_DIR: /tmp/blueprints
      CORS_ORIGINS: '["http://frontend:80", "http://localhost:9109"]'
    healthcheck:
      interval: 5s
      retries: 12
      start_period: 10s
      # NOTE: keep this 2-element form so pre-commit yaml-sorter cannot reorder
      # the CMD prefix out of position. Single-string form is treated as
      # CMD-SHELL by Docker.
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      timeout: 5s
  frontend:
    build:
      context: ./frontend
      target: production
    depends_on:
      backend:
        condition: service_healthy
  playwright:
    command: "sh -c \"npm ci &&\n       timeout 90 sh -c 'until curl -sf http://frontend:80\
      \ > /dev/null; do sleep 2; done' &&\n       npx playwright test\"\n"
    depends_on:
    - frontend
    environment:
      BASE_URL: http://frontend:80
      CI: 'true'
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    volumes:
    - ./test-results:/e2e/test-results
    - ./tests/e2e:/e2e
    working_dir: /e2e
