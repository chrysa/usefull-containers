---
hadolint:dockerfile:
    extends: .analyse_dockerfile
    variables:
        service_name: hadolint
hadolint:
    extends: .build_service
    needs:
        - hadolint:dockerfile
    rules:
        - changes:
              - hadolint/**
    variables:
        service_name: hadolint
hadolint:version:
    extends: .publish_version
    needs:
        - hadolint
    rules:
        - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop"
          changes:
              - hadolint/Dockerfile
    variables:
        service_name: hadolint
hadolint:latest:
    extends: .publish_latest
    needs:
        - hadolint:version
    rules:
        - if: $CI_COMMIT_BRANCH == "master"
          changes:
              - hadolint/**
    variables:
        service_name: hadolint
hadolint:release:
    extends: .release_job
    rules:
        - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "release/*"
          changes:
              - hadolint/**
    variables:
        service_name: hadolint
        version: $(cat .env | grep "HADOOLINT_CONTAINER_VERSION" | cut -d"=" -f1)
