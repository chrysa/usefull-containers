---
hadolint:dockerfile:
    extends: .analyse_dockerfile
    rules:
        - changes:
              - hadolint/Dockerfile
    variables:
        service_name: hadolint

hadolint:build:
    extends: .build_service
    needs:
        - job: hadolint:dockerfile
          optional: true
    rules:
        - changes:
              - hadolint/**
    variables:
        DOCKER_REPO: ${CI_REGISTRY_IMAGE}
        service_name: hadolint

hadolint:version:
    extends: .publish_version_master
    needs:
        - hadolint:build
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - hadolint/docker-compose.yaml
              - hadolint/Dockerfile
              - hadolint/.hadolint.yaml
          variables:
              DOCKER_REPO: ${DOCKER_HUB_USER}
              service_name: hadolint

hadolint:latest:
    extends: .publish_latest
    needs:
        - hadolint:version
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - hadolint/**
    variables:
        service_name: hadolint
hadolint:release:
    extends: .release_job
    rules:
        - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "release/*"
          changes:
              - hadolint/**
    variables:
        service_name: hadolint
        version: $(cat .env | grep "HADOOLINT_CONTAINER_VERSION" | cut -d"=" -f1)
