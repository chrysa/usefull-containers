---
pylint:dockerfile:
    extends: .analyse_dockerfile
    rules:
        - changes:
              - pylint/Dockerfile
    variables:
        service_name: pylint

pylint:build:
    extends: .build_service
    needs:
        - job: pylint:dockerfile
          optional: true
    rules:
        - changes:
              - pylint/*
          when: always
        - changes:
              - pylint/ci.yaml
          when: never
    variables:
        DOCKER_REPO: ${CI_REGISTRY_IMAGE}
        service_name: pylint

pylint:version:
    extends: .publish_version_master
    needs:
        - pylint:build
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - pylint/*
          variables:
              service_name: pylint
          when: always
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - pylint/ci.yaml
          when: never

pylint:latest:
    extends: .publish_latest
    needs:
        - pylint:version
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - pylint/*
          variables:
              service_name: pylint
          when: always
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - pylint/ci.yaml
          when: never
