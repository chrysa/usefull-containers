---
django-drf:dockerfile:
    extends: .analyse_dockerfile
    rules:
        - changes:
              - django-drf/Dockerfile
    variables:
        service_name: django-drf

django-drf:build:
    extends: .build_service
    needs:
        - job: django-drf:dockerfile
          optional: true
    rules:
        - changes:
              - django-drf/*
          when: always
        - changes:
              - django-drf/ci.yaml
          when: never
    variables:
        DOCKER_REPO: ${CI_REGISTRY_IMAGE}
        service_name: django-drf

django-drf:version:
    extends: .publish_version_master
    needs:
        - django-drf:build
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - django-drf/*
          variables:
              service_name: django-drf
          when: always
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - django-drf/ci.yaml
          when: never

django-drf:latest:
    extends: .publish_latest
    needs:
        - django-drf:version
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - django-drf/*
          variables:
              service_name: django-drf
          when: always
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - django-drf/ci.yaml
          when: never
