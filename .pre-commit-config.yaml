---
fail_fast: false
minimum_pre_commit_version: 2.7.0
repos:
    # - repo: meta
    #   hooks:
    #       - id: identity
    #         stages: [manual]
    #       - id: check-hooks-apply
    #         stages: [manual]
    #       - id: check-useless-excludes
    #        stages: [manual]
    - repo: https://github.com/IamTheFij/docker-pre-commit.git
      rev: v2.1.1
      hooks:
          - id: docker-compose-check
            stages: [manual]
            files: docker-compose.[a-zZ-Z\-_]+.y[a]{0,1}ml$
          - id: hadolint
            args: [--config=.hadolint.yaml]
            files: (\.dockerfile|\.Dockerfile|Dockerfile)$
            stages: [manual]
    - repo: https://github.com/Lucas-C/pre-commit-hooks-nodejs
      rev: 17b6d1aa2bdb23297b829bdb881665f42a425e58
      hooks:
          - id: markdown-toc
            args: [--indent, '    ', -i]
            stages: [manual]
    - repo: https://github.com/igorshubovych/markdownlint-cli
      rev: 4e6fb32635431ba651a7ebd035726028974aea28
      hooks:
          - id: markdownlint
            args: [--fix, --config=.markdownlint.yml]
    - repo: https://github.com/adrienverge/yamllint.git
      rev: 6bfd6756e2414e0a16a256eaf6575e922d7e2ac9
      hooks:
          - id: yamllint
            args: [--config-file=.yamllint.yaml, --format, parsable, --strict]
            stages: [manual]
    - repo: https://github.com/smian/pre-commit-makefile.git
      rev: 261f8fb4b31dfdc05d1a1d7fbde1f1462ecde66d
      hooks:
          - id: makefile-doc
            stages: [manual]
    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
      rev: 0.2.2
      hooks:
          - id: yamlfmt
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: b0f11fe246ae49c7a3791009753d2148b97cb677
      hooks:
          - id: check-toml
            files: .toml$
          - id: end-of-file-fixer
          - id: mixed-line-ending
            args: [--fix=lf]
          - id: trailing-whitespace
          - id: check-merge-conflict
            stages: [merge-commit]
