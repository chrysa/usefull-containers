---
fail_fast: false
minimum_pre_commit_version: 2.7.0
repos:
    # - repo: meta
    #   hooks:
    #       - id: identity
    #         stages: [manual]
    #       - id: check-hooks-apply
    #         stages: [manual]
    #       - id: check-useless-excludes
    #        stages: [manual]
    - repo: https://github.com/asottile/setup-cfg-fmt
      rev: 4cda3cfcfc79978f67dcf96d31262b9949be2fd5
      hooks:
          - id: setup-cfg-fmt
    - repo: https://github.com/IamTheFij/docker-pre-commit.git
      rev: aeda358a4a1a064958fd994c9209047bd8c783c8
      hooks:
          - id: docker-compose-check
            stages: [manual]
            files: docker-compose.[a-zZ-Z\-_]+.y[a]{0,1}ml$
          - id: hadolint
            args: [--config=.hadolint.yaml]
            files: (\.dockerfile|\.Dockerfile|Dockerfile)$
            stages: [manual]
    - repo: https://github.com/igorshubovych/markdownlint-cli
      rev: 780a947d4072b9ccee324971680d824f75befd39
      hooks:
          - id: markdownlint
            args: [--fix, --config=.markdownlint.yml]
    - repo: https://github.com/adrienverge/yamllint.git
      rev: 8f682481c725047d3eb9409faecf0719caec1b8a
      hooks:
          - id: yamllint
            args: [--config-file=.yamllint.yaml, --format, parsable, --strict]
            stages: [manual]
    - repo: https://github.com/smian/pre-commit-makefile.git
      rev: 261f8fb4b31dfdc05d1a1d7fbde1f1462ecde66d
      hooks:
          - id: makefile-doc
            stages: [manual]
    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
      rev: 0.1.0
      hooks:
          - id: yamlfmt
    - repo: https://github.com/pre-commit/mirrors-pylint
      rev: ab1d036e0d0f1f56b990f261b90115dd2899e7a8
      hooks:
          - id: pylint
            files: ^\W+/\W+.*.py$
            args: [--rcfile=./src/setup.cfg, --reports=no, --persistent=yes]
            stages: [manual]
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: 51e14fcc979aa701431359dfb82f8583b13779fe
      hooks:
          # - id: check-toml
          #   files: .toml$
          - id: end-of-file-fixer
          - id: mixed-line-ending
            args: [--fix=lf]
          - id: trailing-whitespace
          - id: check-merge-conflict
            stages: [merge-commit]
