repos:
- hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-json
  - id: check-toml
  - args:
    - --maxkb=1024
    id: check-added-large-files
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: mixed-line-ending
  - id: detect-private-key
  - args:
    - --branch
    - main
    id: no-commit-to-branch
  repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
- hooks:
  - args:
    - --baseline
    - .secrets.baseline
    exclude: package.lock.json|yarn.lock|pnpm-lock.yaml
    id: detect-secrets
  repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
- hooks:
  - args:
    - --strict
    - --force-scope
    - feat
    - fix
    - chore
    - docs
    - refactor
    - test
    - ci
    - build
    - perf
    id: conventional-pre-commit
    stages:
    - commit-msg
  repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.4.0
- hooks:
  - args:
    - --disable
    - MD013
    - MD022
    - MD025
    - MD032
    - MD033
    - MD040
    - MD060
    - --
    id: markdownlint
  repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.48.0
- hooks:
  - args:
    - -d
    - '{extends: default, rules: {line-length: disable, document-start: disable, indentation:
      disable, truthy: disable}}'
    exclude: ^(GitVersion\.yml|\.github/ISSUE_TEMPLATE/)
    id: yamllint
  repo: https://github.com/adrienverge/yamllint
  rev: v1.38.0
- hooks:
  - files: ^\.github/workflows/.*\.ya?ml$
    id: actionlint
  repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
- hooks:
  - id: makefile-check
  - id: debugger-detection
    exclude: (^|/)tests?/|^(README\.md|docs/)
  - id: python-print-detection
    exclude: (^|/)tests?/|^(README\.md|docs/)
  - id: python-pprint-detection
    exclude: (^|/)tests?/|^(README\.md|docs/)
  - id: no-bare-except
  - id: python-logger-detection
    exclude: (^|/)tests?/|^(README\.md|docs/)
  - id: dockerfile-no-latest
  - id: console-log-detection
  - id: console-debug-detection
  - id: react-console-error-detection
  - id: no-console-warn
  - id: import-no-relative-parent
  - id: yaml-sorter
    exclude: ^(\.github/workflows/|\.github/ISSUE_TEMPLATE/|GitVersion\.yml|docker-compose.*\.yml)
  - id: json-sorter
  - id: adr-gate
  - id: regression-gate
    stages:
    - pre-push
  - id: env-file-check
  - id: env-example-sync
  - id: claude-skill-frontmatter
  - id: claude-agent-frontmatter
  - id: claude-mcp-config
  - id: python-no-unittest-import
  - id: claude-assets-present
  - id: python-untyped-raise
    exclude: (^|/)tests?/
  - id: python-mutable-default
  - id: python-dispatch-ladder
  - id: python-unreachable-code
  - id: no-hardcoded-localhost
    exclude: tests?/|\.test\.|\.spec\.
  - id: fastapi-missing-response-model
    exclude: (^|/)tests/
  - id: fastapi-missing-links
    exclude: (^|/)tests/
  - id: no-sync-in-async
  - id: ts-unreachable-code
  repo: https://github.com/chrysa/pre-commit-tools
  rev: v0.2.0-247
- repo: local
  hooks:
  - id: run-tests
    name: run test suite (with coverage)
    entry: make docker-test
    language: system
    pass_filenames: false
    stages:
    - pre-push
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks
- repo: https://github.com/chrysa/guideline-checker
  rev: v1.30.16
  hooks:
  - id: guideline-check
