default_language_version:
  python: python3.14
fail_fast: false
minimum_pre_commit_version: 4.1.0
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
    exclude: ^(\.github/)ISSUE_TEMPLATE/
  - id: check-merge-conflict
  - id: check-added-large-files
  - id: mixed-line-ending
  - id: check-json
  - id: detect-private-key
  - args:
    - --branch
    - main
    id: no-commit-to-branch
- repo: https://github.com/chrysa/pre-commit-tools
  rev: v0.2.0-247
  hooks:
  - id: makefile-check
  - id: format-dockerfiles
  - id: dockerfile-no-latest
  - id: env-file-check
  - id: yaml-sorter
    exclude: ^(\.github/|pre-commit/|\.pre-commit-config\.yaml|\.hadolint\.yaml|\.yamllint\.yaml|\.markdownlint\.yml|GitVersion\.yml)
  - id: adr-gate
  - id: python-print-detection
    exclude: (^|/)tests?/|^(README\.md|docs/)
  - id: python-pprint-detection
    exclude: (^|/)tests?/|^(README\.md|docs/)
  - id: no-bare-except
  - id: python-logger-detection
    exclude: (^|/)tests?/|^(README\.md|docs/)
  - id: no-sync-in-async
  - id: debugger-detection
    exclude: (^|/)tests?/|^(README\.md|docs/)
  - id: env-example-sync
  - id: regression-gate
    stages:
    - pre-push
  - id: json-sorter
  - id: claude-skill-frontmatter
  - id: claude-agent-frontmatter
  - id: claude-mcp-config
  - id: python-no-unittest-import
  - id: claude-assets-present
  - id: python-untyped-raise
    exclude: (^|/)tests?/
  - id: python-mutable-default
  - id: python-dispatch-ladder
  - id: python-unreachable-code
  - id: no-hardcoded-localhost
    exclude: tests?/|\.test\.|\.spec\.
- repo: https://github.com/AleksaC/hadolint-py
  rev: v2.15.1
  hooks:
  - id: hadolint
    args:
    - -c
    - .hadolint.yaml
- repo: https://github.com/lovesegfault/beautysh
  rev: v6.4.3
  hooks:
  - id: beautysh
    args:
    - --indent-size
    - '4'
- repo: https://github.com/openstack/bashate
  rev: 2.1.1
  hooks:
  - id: bashate
    args:
    - --ignore=E006,E020
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.1
  hooks:
  - id: markdownlint
    args:
    - --fix
    stages:
    - manual
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    args:
    - --baseline
    - .secrets.baseline
    exclude: \.pre-commit-config\.yaml
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.4.0
  hooks:
  - id: conventional-pre-commit
    stages:
    - commit-msg
    args:
    - feat
    - fix
    - docs
    - style
    - refactor
    - test
    - chore
    - perf
    - revert
    - ci
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks
- repo: https://github.com/chrysa/guideline-checker
  rev: v1.30.10
  hooks:
  - id: guideline-check
