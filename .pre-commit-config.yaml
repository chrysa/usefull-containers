---
fail_fast: false
minimum_pre_commit_version: 2.7.0
repos:
    # - repo: meta
    #   hooks:
    #       - id: identity
    #         stages: [manual]
    #       - id: check-hooks-apply
    #         stages: [manual]
    #       - id: check-useless-excludes
    #        stages: [manual]
    # - repo: https://github.com/chrysa/pre-commit-hooks-changelog
    #   rev: 3be37b215079a981171a173d60fdf4222a3162d4
    #   hooks:
    #       - id: generate-changelog
    #         stages: [manual]
    - repo: https://github.com/IamTheFij/docker-pre-commit.git
      rev: v2.0.1
      hooks:
          - id: docker-compose-check
            stages: [manual]
            files: docker-compose.[a-zZ-Z\-_]+.y[a]{0,1}ml$
          - id: hadolint
            args: [--config=.hadolint.yaml]
            files: (\.dockerfile|\.Dockerfile|Dockerfile)$
            stages: [manual]
    - repo: https://github.com/Lucas-C/pre-commit-hooks-nodejs
      rev: v1.1.1
      hooks:
          - id: markdown-toc
            args: [--indent, '    ', -i]
            stages: [manual]
    - repo: https://github.com/igorshubovych/markdownlint-cli
      rev: 910f4518827d9ed648cbee959395e09bdb0b43fc
      hooks:
          - id: markdownlint
            args: [--fix]
    - repo: https://github.com/adrienverge/yamllint.git
      rev: v1.26.2
      hooks:
          - id: yamllint
            args: [--config-file=.yamllint.yaml, --format, parsable, --strict]
            stages: [manual]
    - repo: https://github.com/smian/pre-commit-makefile.git
      rev: 261f8fb4b31dfdc05d1a1d7fbde1f1462ecde66d
      hooks:
          - id: makefile-doc
            stages: [manual]
    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
      rev: 0.1.0
      hooks:
          - id: yamlfmt
    - repo: https://github.com/pre-commit/mirrors-pylint
      rev: v3.0.0a4
      hooks:
          - id: pylint
            files: ^\W+/\W+.*.py$
            args: [--rcfile=./src/setup.cfg, --reports=no, --persistent=yes]
            stages: [manual]
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: 25d61d4784acfe8727ef3066813edcfb002ee8a3
      hooks:
          # - id: check-toml
          #   files: .toml$
          - id: end-of-file-fixer
          - id: mixed-line-ending
            args: [--fix=lf]
          - id: trailing-whitespace
          - id: check-merge-conflict
            stages: [merge-commit]
