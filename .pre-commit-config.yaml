---
default_language_version:
    python: python3.14
fail_fast: false
minimum_pre_commit_version: 4.1.0
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
            exclude: ^(\.github/)ISSUE_TEMPLATE/
          - id: check-merge-conflict
          - id: check-added-large-files
          - id: mixed-line-ending
    - repo: https://github.com/chrysa/pre-commit-tools
      rev0.1.1-76 v0.1.1-76
      hooks:
          - id: format-dockerfiles
          - id: dockerfile-no-latest
          - id: env-file-check
          - id: yaml-sorter
            exclude: ^(\.github/|pre-commit/|\.pre-commit-config\.yaml|\.hadolint\.yaml|\.yamllint\.yaml|\.markdownlint\.yml|GitVersion\.yml)
          - id: regression-gate
            stages: [pre-push]
    - repo: https://github.com/AleksaC/hadolint-py
      rev: v2.14.0
      hooks:
          - id: hadolint
            args:
                - -c
                - .hadolint.yaml
    - repo: https://github.com/lovesegfault/beautysh
      rev: v6.4.3
      hooks:
          - id: beautysh
            args: [--indent-size, '4']
    - repo: https://github.com/openstack/bashate
      rev: 2.1.1
      hooks:
          - id: bashate
            args:
                - --ignore=E006,E020
    - repo: https://github.com/igorshubovych/markdownlint-cli
      rev: v0.48.0
      hooks:
          - id: markdownlint
            args: [--fix]
            stages: [manual]
    - repo: https://github.com/Yelp/detect-secrets
      rev: v1.5.0
      hooks:
          - id: detect-secrets
            args: [--baseline, .secrets.baseline]
            exclude: \.pre-commit-config\.yaml

    - repo: https://github.com/compilerla/conventional-pre-commit
      rev: v4.4.0
      hooks:
          - id: conventional-pre-commit
            stages: [commit-msg]
            args: [feat, fix, docs, style, refactor, test, chore, perf, revert, ci]
