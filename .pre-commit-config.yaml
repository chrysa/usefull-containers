---
default_language_version:
    python: python3.14
fail_fast: false
minimum_pre_commit_version: 4.1.0
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: f1dff44d3a9ae852957f34def96390f28719c232
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
            exclude: ^\.github/ISSUE_TEMPLATE/
          - id: check-merge-conflict
          - id: check-added-large-files
          - id: mixed-line-ending
    - repo: https://github.com/chrysa/pre-commit-tools
      rev: 6776765760636f4f81d1956480f35afac197954f
      hooks:
          - id: format-dockerfiles
          - id: dockerfile-no-latest
          - id: env-file-check
          - id: yaml-sorter
            exclude: ^(\.github/|pre-commit/|\.pre-commit-config\.yaml|\.hadolint\.yaml|\.yamllint\.yaml|\.markdownlint\.yml)
    - repo: https://github.com/AleksaC/hadolint-py
      rev: 446db46ab58b26eb8e40d5626c1229e8cf75b3b5
      hooks:
          - id: hadolint
            args:
                - -c
                - .hadolint.yaml
    - repo: https://github.com/lovesegfault/beautysh
      rev: 34c3b3da0233e76d7d1ad90a78f3679185ecf31c
      hooks:
          - id: beautysh
            args: [--indent-size, '4']
    - repo: https://github.com/openstack/bashate
      rev: ec2f2400915200d633299612a02d7d285e4be24c
      hooks:
          - id: bashate
            args:
                - --ignore=E006,E020
    - repo: https://github.com/igorshubovych/markdownlint-cli
      rev: 804e22828e98e561085e47f39a15f42c8397b883
      hooks:
          - id: markdownlint
            args: [--fix]
            stages: [manual]
    - repo: https://github.com/Yelp/detect-secrets
      rev: 5e141933554a0b74e7341841f318be21e895339c
      hooks:
          - id: detect-secrets
            args: [--baseline, .secrets.baseline]
            exclude: \.pre-commit-config\.yaml
