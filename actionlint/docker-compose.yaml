services:
  actionlint:
    build:
      context: .
      dockerfile: Dockerfile
      labels:
        build_date: ${BUILD_DATE:-}
        commit_id: ${CI_COMMIT_SHA:-}
        departement: QA
        description: static checker for GitHub Actions workflow files
        maintainer: ${MAINTAINER_NAME-} <${MAINTAINER_MAIL}>
        vcs-ref: ${CI_COMMIT_SHA:-}
        vcs-url: ${CI_REPOSITORY_URL:-}
        version: ${ACTIONLINT_CONTAINER_VERSION}
    container_name: actionlint
    image: ${DOCKER_REPO:-local}/actionlint:${ACTIONLINT_CONTAINER_VERSION}
    tty: true
    working_dir: /app
