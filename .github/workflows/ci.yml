---
# Thin caller of the generalized chrysa lean CI (fullstack monorepo).
# Gate = make pre-commit; tests = make docker-test; sonar. Auto-versioning in release.yml.

name: CI

on:
    pull_request:
        branches: [develop, main]
    push:
        branches: [develop, main, "feat/**", "fix/**", "chore/**", "ci/**"]
    workflow_dispatch:

permissions:
    contents: read
    checks: write
    pull-requests: write

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        uses: chrysa/github-actions/.github/workflows/ci-fullstack.yml@v1.8.1
        with:
            project-key: chrysa_satisfactory-factory-manager
            project-name: satisfactory-factory-manager
            test-target: docker-test
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
