---
name: CI

run-name: ${{ github.workflow }} by ${{ github.actor }}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

on:
    push:
        branches:
            - main
            - develop
            - "feat/**"
            - "fix/**"
            - "ci/**"
            - "chore/**"
    pull_request:
        types:
            - opened
            - ready_for_review
            - reopened
            - synchronize
    workflow_dispatch:

jobs:
    pre-commit:
        name: Pre-commit checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: chrysa/github-actions/python-setup@v1.6.0
              with:
                  python-version: "3.14"
            - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

    hadolint:
        name: Hadolint — ${{ matrix.service }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                service:
                    - black
                    - flake8
                    - hadolint
                    - mypy
                    - pre-commit
                    - pylint
                    - pytest
                    - python-dev
                    - reorder-python-imports
                    - sphinx
                    - ruff
                    - bandit
                    - safety
                    - trivy
                    - actionlint
                    - yamllint
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Run hadolint on ${{ matrix.service }}/Dockerfile
              uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
              with:
                  dockerfile: ${{ matrix.service }}/Dockerfile
                  config: .hadolint.yaml
                  failure-threshold: warning

    docker-compose-validate:
        name: Validate docker-compose files
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Validate root docker-compose.yaml
              run: docker compose config --quiet
              shell: bash
            - name: Validate service docker-compose files
              run: |
                  for svc in black flake8 hadolint mypy pre-commit pylint pytest python-dev reorder-python-imports sphinx; do
                      echo "Validating ${svc}/docker-compose.yaml..."
                      docker compose -f "${svc}/docker-compose.yaml" config --quiet
                  done
              shell: bash

    ci:
        name: CI
        runs-on: ubuntu-latest
        permissions: {}
        needs:
            - pre-commit
            - hadolint
            - docker-compose-validate
        if: always()
        steps:
            - name: Check required jobs
              run: |
                  if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
                      echo "One or more required checks failed or were cancelled"
                      exit 1
                  fi
                  echo "All required checks passed"
              shell: bash
