---
name: 🐳 Build & Publish
run-name: ${{ github.workflow }} by ${{ github.actor }}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

on:
    push:
        branches:
            - main
            - develop
    workflow_call:
        outputs:
            version:
                description: Computed semver version
                value: ${{ jobs.versioning.outputs.semVer }}
    workflow_dispatch:

permissions:
    contents: read

jobs:
    versioning:
        name: Compute version
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            semVer: ${{ steps.gitversion.outputs.semVer }}
            fullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.0
              with:
                  fetch-depth: 0
            - name: Compute GitVersion
              id: gitversion
              uses: chrysa/github-actions/gitversion@v1.2.1
            - name: Display version
              run: echo "Version ${{ steps.gitversion.outputs.semVer }}"
              shell: bash

    build:
        name: Build — ${{ matrix.service }}
        needs: versioning
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                service:
                    - black
                    - flake8
                    - hadolint
                    - mypy
                    - pre-commit
                    - pylint
                    - pytest
                    - python-dev
                    - reorder-python-imports
                    - sphinx
                    - ruff
                    - bandit
                    - safety
                    - trivy
                    - actionlint
                    - yamllint
        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.0
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login to Docker Hub
              if: github.ref == 'refs/heads/main'
              uses: docker/login-action@v4.2.0
              with:
                  username: ${{ vars.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_TOKEN }}
            - name: Build and push ${{ matrix.service }}
              uses: docker/build-push-action@v7.2.0
              with:
                  context: ${{ matrix.service }}/
                  file: ${{ matrix.service }}/Dockerfile
                  push: ${{ github.ref == 'refs/heads/main' }}
                  tags: |
                      ${{ vars.DOCKER_HUB_USERNAME }}/${{ matrix.service }}:${{ needs.versioning.outputs.semVer }}
                      ${{ vars.DOCKER_HUB_USERNAME }}/${{ matrix.service }}:latest
                  labels: |
                      org.opencontainers.image.version=${{ needs.versioning.outputs.semVer }}
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
