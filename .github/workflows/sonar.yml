name: SonarCloud Analysis

on:
    push:
        branches: [main, master, develop]
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read
    pull-requests: read

jobs:
    sonar:
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        name: SonarCloud scan
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - name: SonarCloud scan
              uses: SonarSource/sonarqube-scan-action@v4.2.1
              with:
                  args: >
                      -Dsonar.projectKey=chrysa_satisfactory-factory-manager
                      -Dsonar.organization=chrysa
                      -Dsonar.projectName=satisfactory-factory-manager
                      -Dsonar.sources=backend/app,frontend/src
                      -Dsonar.tests=backend/tests
                      -Dsonar.python.coverage.reportPaths=backend/coverage.xml
                      -Dsonar.exclusions=**/.git/**,**/reports/**,**/.vscode/**,**/node_modules/**,**/__pycache__/**,**/dist/**,**/.mypy_cache/**,**/public/mockServiceWorker.js
                      -Dsonar.sourceEncoding=UTF-8
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
