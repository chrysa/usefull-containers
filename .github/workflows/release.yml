---
name: Release

on:
    push:
        branches: [main, master]
        paths-ignore:
            - '**.md'
            - .github/**
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: read

jobs:
    release:
        runs-on: ubuntu-latest
        name: Create release
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0
                  token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

            - name: Setup GitVersion
              uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
              with:
                  versionSpec: 6.x

            - name: Determine version
              id: gitversion
              uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

            - name: Install git-cliff
              uses: taiki-e/install-action@e215f18e24d7f4b411833009234c054235f9447f # git-cliff

            - name: Generate changelog
              id: changelog
              run: |
                  CURRENT_TAG="v${{ steps.gitversion.outputs.semVer }}"
                  git cliff --output CHANGELOG_RELEASE.md --tag "$CURRENT_TAG" 2>/dev/null || \
                    git cliff --unreleased --output CHANGELOG_RELEASE.md
                  echo "version=$CURRENT_TAG" >> "$GITHUB_OUTPUT"

            - name: Create tag
              run: |
                  git config user.name 'chrysa'
                  git config user.email 'greau.anthony+chrysa@gmail.com'
                  git tag "${{ steps.changelog.outputs.version }}" || echo "Tag already exists"
                  git push origin "${{ steps.changelog.outputs.version }}" || echo "Tag push skipped"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
              with:
                  tag_name: ${{ steps.changelog.outputs.version }}
                  name: Release ${{ steps.changelog.outputs.version }}
                  body_path: CHANGELOG_RELEASE.md
                  token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
