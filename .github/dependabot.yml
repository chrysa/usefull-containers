---
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /.github/workflows/
      open-pull-requests-limit: 5
      schedule:
          interval: weekly
          day: monday
      commit-message:
          prefix: chore(deps)
      labels:
          - dependencies
      groups:
          actions-official:
              patterns:
                  - actions/*
          docker-actions:
              patterns:
                  - docker/*
          sonar-actions:
              patterns:
                  - SonarSource/*
          community-actions:
              patterns:
                  - '*'

    - package-ecosystem: pre-commit
      directory: /
      open-pull-requests-limit: 5
      schedule:
          interval: weekly
          day: monday
      commit-message:
          prefix: chore(deps)
      labels:
          - dependencies

