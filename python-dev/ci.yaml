---
python-dev:dockerfile:
    extends: .analyse_dockerfile
    variables:
        service_name: python-dev
python-dev:
    extends: .build_service
    needs:
        - python-dev:dockerfile
    rules:
        - changes:
              - python-dev/**
    variables:
        service_name: python-dev
python-dev:version:
    extends: .publish_version
    needs:
        - python-dev
    rules:
        - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop"
          changes:
              - python-dev/Dockerfile
    variables:
        service_name: python-dev
python-dev:latest:
    extends: .publish_latest
    needs:
        - python-dev:version
    rules:
        - if: $CI_COMMIT_BRANCH == "master"
          changes:
              - python-dev/**
    variables:
        service_name: python-dev
python-dev:release:
    extends: .release_job
    rules:
        - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "release/*"
          changes:
              - python-dev/**
    variables:
        service_name: python-dev
        version: $(cat .env | grep "PYTHON_DEV_CONTAINER_VERSION" | cut -d"=" -f1)
