services:
  python-dev:
    build:
      context: .
      dockerfile: Dockerfile
      labels:
        build_date: ${BUILD_DATE:-}
        commit_id: ${CI_COMMIT_SHA:-}
        departement: dev
        description: python container for dev
        maintainer: ${MAINTAINER_NAME-} <${MAINTAINER_MAIL}>
        vcs-ref: ${CI_COMMIT_SHA:-}
        vcs-url: ${CI_REPOSITORY_URL:-}
        version: ${PYTHON_DEV_CONTAINER_VERSION}
    container_name: python-dev
    image: ${DOCKER_REPO:-local}/python-dev:${PYTHON_DEV_CONTAINER_VERSION}
    tty: true
    working_dir: /app
