[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfm-agent"
version = "0.1.0"
description = "Local sync agent for Satisfactory Factory Manager — watches a blueprint folder and syncs with the hub"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.28.0",
    "watchdog>=6.0.0",
    "pydantic-settings>=2.6.0",
    "rich>=13.0.0",
]

[project.scripts]
sfm-agent = "sfm_agent.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-cov>=6.0.0", "pytest-mock>=3.14.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sfm_agent --cov-report=term-missing --cov-report=xml --cov-fail-under=85"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
