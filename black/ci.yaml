---
black:dockerfile:
    extends: .analyse_dockerfile
    rules:
        - changes:
              - black/Dockerfile
    variables:
        service_name: black

black:build:
    extends: .build_service
    needs:
        - job: black:dockerfile
          optional: true
    rules:
        - changes:
              - black/*
          when: always
        - changes:
              - black/black-default.toml
              - black/ci.yaml
          when: never
    variables:
        DOCKER_REPO: ${CI_REGISTRY_IMAGE}
        service_name: black

black:version:
    extends: .publish_version_master
    needs:
        - black:build
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - black/*
          variables:
              service_name: black
          when: always
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - black/black-default.toml
              - black/ci.yaml
          when: never

black:latest:
    extends: .publish_latest
    needs:
        - black:version
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - black/*
          variables:
              service_name: black
          when: always
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - black/black-default.toml
              - black/ci.yaml
          when: never
