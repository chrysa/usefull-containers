[tool.black]
line-length = 120
target-version = ['py37','py38','py39','py310']
include = '\.py?$'
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.benchmark
    | \.mypy_cache
    | \.pytest_cache
    | build
    | dist
  )/
)
'''
