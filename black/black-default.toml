[tool.black]
color = true
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.benchmark
    | \.mypy_cache
    | \.pytest_cache
    | build
    | dist
  )/
)
'''
include = '\.py?$'
line-length = 120
preview = true
target-version = ['py310','py311']
verbose = true
