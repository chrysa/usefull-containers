---
flake8:dockerfile:
    extends: .analyse_dockerfile
    variables:
        service_name: flake8
flake8:
    extends: .build_service
    needs:
        - flake8:dockerfile
    rules:
        - changes:
              - flake8/**
    variables:
        service_name: flake8
flake8:version:
    extends: .publish_version
    needs:
        - flake8
    rules:
        - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop"
          changes:
              - flake8/Dockerfile
    variables:
        service_name: flake8
flake8:latest:
    extends: .publish_latest
    needs:
        - flake8:version
    rules:
        - if: $CI_COMMIT_BRANCH == "master"
          changes:
              - flake8/**
    variables:
        service_name: flake8
flake8:release:
    extends: .release_job
    rules:
        - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "release/*"
          changes:
              - flake8/**
    variables:
        service_name: flake8
        version: $(cat .env | grep "FLAKE8_CONTAINER_VERSION" | cut -d"=" -f1)
