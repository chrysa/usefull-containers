---
flake8:dockerfile:
    extends: .analyse_dockerfile
    rules:
        - changes:
              - flake8/Dockerfile
    variables:
        service_name: flake8

flake8:build:
    extends: .build_service
    needs:
        - job: flake8:dockerfile
          optional: true
    rules:
        - changes:
              - flake8/docker-compose.yaml
              - flake8/Dockerfile
    variables:
        DOCKER_REPO: ${CI_REGISTRY_IMAGE}
        service_name: flake8

flake8:version:
    extends: .publish_version_master
    needs:
        - flake8:build
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - flake8/docker-compose.yaml
              - flake8/Dockerfile
          variables:
              DOCKER_REPO: ${DOCKER_HUB_USER}
              service_name: flake8

flake8:latest:
    extends: .publish_latest
    needs:
        - flake8:version
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - flake8/docker-compose.yaml
              - flake8/Dockerfile
          variables:
              DOCKER_REPO: ${DOCKER_HUB_USER}
              service_name: flake8
