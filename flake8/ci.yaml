---
flake8:dockerfile:
    extends: .analyse_dockerfile
    variables:
        service_name: flake8
flake8:
    extends: .build_service
    needs:
        - job: flake8:dockerfile
          optional: true
    rules:
        - changes:
              - flake8/docker-compose.yaml
              - flake8/Dockerfile
    variables:
        service_name: flake8
flake8:version:
    extends: .publish_version
    needs:
        - flake8
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $STAGGING_BRANCH
          changes:
              - flake8/docker-compose.yaml
              - flake8/Dockerfile
    variables:
        service_name: flake8
flake8:latest:
    extends: .publish_latest
    needs:
        - flake8:version
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - flake8/docker-compose.yaml
              - flake8/Dockerfile
    variables:
        service_name: flake8
