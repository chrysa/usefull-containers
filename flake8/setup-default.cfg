[metadata]
name = configs
classifiers =
    Programming Language :: Python :: 3

[flake8]
ban-relative-imports = True
count = True
exclude = .git,__pycache__
extend-ignore =
    E203
hang-closing = False
ignore = E203,W503
max-complexity = 15
max-line-length = 120
select = B,C,E,F,W,T4,B9
statistics = True
mypy_config = ./config-tools/setup.cfg
