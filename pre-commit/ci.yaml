---
pre-commit:dockerfile:
    extends: .analyse_dockerfile
    rules:
        - changes:
              - pre-commit/Dockerfile
    variables:
        service_name: pre-commit

pre-commit:build:
    extends: .build_service
    needs:
        - job: pre-commit:dockerfile
          optional: true
    rules:
        - changes:
              - pre-commit/*
          when: always
        - changes:
              - pre-commit/.pre-commit-config.yaml
              - pre-commit/ci.yaml
          when: never
    variables:
        DOCKER_REPO: ${CI_REGISTRY_IMAGE}
        service_name: pre-commit

pre-commit:version:
    extends: .publish_version_master
    needs:
        - pre-commit:build
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - pre-commit/*
          variables:
              service_name: pre-commit
          when: always
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - pre-commit/.pre-commit-config.yaml
              - pre-commit/ci.yaml
          when: never

pre-commit:latest:
    extends: .publish_latest
    needs:
        - pre-commit:version
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - pre-commit/*
          variables:
              service_name: pre-commit
          when: always
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - pre-commit/.pre-commit-config.yaml
              - pre-commit/ci.yaml
          when: never
