services:
  pytest:
    build:
      context: .
      dockerfile: Dockerfile
      labels:
        build_date: ${BUILD_DATE:-}
        commit_id: ${CI_COMMIT_SHA:-}
        departement: test
        description: python unit test runner
        maintainer: ${MAINTAINER_NAME-} <${MAINTAINER_MAIL}>
        vcs-ref: ${CI_COMMIT_SHA:-}
        vcs-url: ${CI_REPOSITORY_URL:-}
        version: ${PYTEST_CONTAINER_VERSION}
    container_name: pytest
    image: ${DOCKER_REPO:-local}/pytest:${PYTEST_CONTAINER_VERSION}
    tty: true
    working_dir: /app
