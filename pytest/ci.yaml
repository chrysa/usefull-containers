---
pytest:dockerfile:
    extends: .analyse_dockerfile
    rules:
        - changes:
              - pytest/Dockerfile
    variables:
        service_name: pytest

pytest:build:
    extends: .build_service
    needs:
        - job: pytest:dockerfile
          optional: true
    rules:
        - changes:
              - pytest/*
          when: always
        - changes:
              - pytest/ci.yaml
          when: never
    variables:
        DOCKER_REPO: ${CI_REGISTRY_IMAGE}
        service_name: pytest

pytest:version:
    extends: .publish_version_master
    needs:
        - pytest:build
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - pytest/*
          variables:
              service_name: pytest
          when: always
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - pytest/ci.yaml
          when: never

pytest:latest:
    extends: .publish_latest
    needs:
        - pytest:version
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - pytest/*
          variables:
              service_name: pytest
          when: always
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - pytest/ci.yaml
          when: never
