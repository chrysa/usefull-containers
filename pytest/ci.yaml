---
pytest:dockerfile:
    extends: .analyse_dockerfile
    variables:
        service_name: pytest
pytest:
    extends: .build_service
    needs:
        - job: pytest:dockerfile
          optional: true
    rules:
        - changes:
              - pytest/docker-compose.yaml
              - pytest/Dockerfile
    variables:
        service_name: pytest
pytest:latest:
    extends: .publish_latest
    needs:
        - pytest:version
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - pytest/docker-compose.yaml
              - pytest/Dockerfile
    variables:
        service_name: pytest
        CI_REGISTRY_IMAGE: ${DOCKER_HUB_REPO}
