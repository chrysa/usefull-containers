---
.analyse_dockerfile:
    image: hadolint/hadolint:latest-debian
    stage: analyse
    script:
        - hadolint --config=.hadolint.yaml ${service_name}/Dockerfile

.build_service:
    stage: build
    after_script:
        - docker logout
    before_script:
        - docker login --username=$CI_REGISTRY_USER --password=$CI_REGISTRY_PASSWORD $CI_REGISTRY
        - export BUILD_DATE=$(date '+%H-%M_-%d-%m-%Y')
    retry:
        max: 2
        when:
            - script_failure
            - stuck_or_timeout_failure
            - runner_system_failure
    script:
        - docker-compose --env-file ${CI_PROJECT_DIR}/.env pull --include-dep ${service_name} || true
        - docker-compose --env-file ${CI_PROJECT_DIR}/.env build --compress --force-rm ${service_name}
        - docker-compose --env-file ${CI_PROJECT_DIR}/.env push ${service_name}

.publish_version_master:
    stage: publish container version
    after_script:
        - docker logout
    before_script:
        - export BUILD_DATE=$(date '+%H-%M_-%d-%m-%Y')
    retry:
        max: 2
        when:
            - script_failure
            - missing_dependency_failure
    script:
        - export PASSED_REPO=${DOCKER_REPO}
        - export DOCKER_REPO=${CI_REGISTRY_IMAGE}
        - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN  $CI_REGISTRY
        - docker-compose --env-file ${CI_PROJECT_DIR}/.env pull --include-dep ${service_name}
        - docker logout
        - export VERSION=`docker-compose config | grep "${DOCKER_REPO}/${service_name}:" | cut -d":" -f3`
        - env
        - docker tag ${DOCKER_REPO}/${service_name}:${VERSION} ${PASSED_REPO}/${service_name}:${VERSION}
        - docker push ${DOCKER_REPO}/${service_name}:${VERSION}

.publish_latest:
    stage: publish container latest
    after_script:
        - docker logout
    before_script:
        - export BUILD_DATE=$(date '+%H-%M_-%d-%m-%Y')
    retry:
        max: 2
        when:
            - script_failure
            - missing_dependency_failure
    script:
        - export PASSED_REPO=${DOCKER_REPO}
        - export DOCKER_REPO=${CI_REGISTRY_IMAGE}
        - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN  $CI_REGISTRY
        - docker-compose --env-file ${CI_PROJECT_DIR}/.env pull --include-dep ${service_name}
        - docker logout
        - export VERSION=`docker-compose config | grep "${DOCKER_REPO}/${service_name}:" | cut -d":" -f3`
        - env
        - docker tag ${DOCKER_REPO}/${service_name}:${VERSION} ${PASSED_REPO}/${service_name}:latest
        - docker push ${DOCKER_REPO}/${service_name}:latest
