---
mypy:dockerfile:
    extends: .analyse_dockerfile
    variables:
        service_name: mypy
mypy:
    extends: .build_service
    needs:
        - job: mypy:dockerfile
          optional: true
    rules:
        - changes:
              - mypy/docker-compose.yaml
              - mypy/Dockerfile
    variables:
        service_name: mypy
mypy:latest:
    extends: .publish_latest
    needs:
        - mypy:version
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - mypy/docker-compose.yaml
              - mypy/Dockerfile
    variables:
        service_name: mypy
        CI_REGISTRY_IMAGE: ${DOCKER_HUB_REPO}
