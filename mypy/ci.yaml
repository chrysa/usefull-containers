---
mypy:dockerfile:
    extends: .analyse_dockerfile
    rules:
        - changes:
              - mypy/Dockerfile
    variables:
        service_name: mypy

mypy:build:
    extends: .build_service
    needs:
        - job: mypy:dockerfile
          optional: true
    rules:
        - changes:
              - mypy/docker-compose.yaml
              - mypy/Dockerfile
    variables:
        DOCKER_REPO: ${CI_REGISTRY_IMAGE}
        service_name: mypy

mypy:version:
    extends: .publish_version
    needs:
        - mypy:build
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $STAGGING_BRANCH
          changes:
              - mypy/docker-compose.yaml
              - mypy/Dockerfile
          variables:
              DOCKER_REPO: ${CI_REGISTRY_IMAGE}
              service_name: mypy
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - mypy/docker-compose.yaml
              - mypy/Dockerfile
          variables:
              DOCKER_REPO: ${DOCKER_HUB_USER}
              service_name: mypy

mypy:latest:
    extends: .publish_latest
    needs:
        - mypy:version
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - mypy/docker-compose.yaml
              - mypy/Dockerfile
          variables:
              DOCKER_REPO: ${DOCKER_HUB_USER}
              service_name: mypy
