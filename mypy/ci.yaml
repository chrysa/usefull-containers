---
mypy:dockerfile:
    extends: .analyse_dockerfile
    variables:
        service_name: mypy
mypy:
    extends: .build_service
    needs:
        - mypy:dockerfile
    rules:
        - changes:
              - mypy/Dockerfile
    variables:
        service_name: mypy
mypy:version:
    extends: .publish_version
    needs:
        - mypy
    rules:
        - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "release/*"
          changes:
              - mypy/Dockerfile
    variables:
        service_name: mypy

mypy:latest:
    extends: .publish_latest
    needs:
        - mypy:version
    rules:
        - if: $CI_COMMIT_BRANCH == "master"
          changes:
              - mypy/Dockerfile
    variables:
        service_name: mypy
