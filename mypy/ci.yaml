---
mypy:dockerfile:
    extends: .analyse_dockerfile
    rules:
        - changes:
              - mypy/Dockerfile
    variables:
        service_name: mypy

mypy:build:
    extends: .build_service
    needs:
        - job: mypy:dockerfile
          optional: true
    rules:
        - changes:
              - mypy/**
    variables:
        DOCKER_REPO: ${CI_REGISTRY_IMAGE}
        service_name: mypy

mypy:version:
    extends: .publish_version_master
    needs:
        - mypy:build
    rules:
        - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop"
          changes:
              - mypy/docker-compose.yaml
              - mypy/Dockerfile
    variables:
        service_name: mypy
mypy:latest:
    extends: .publish_latest
    needs:
        - mypy:version
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - mypy/**
    variables:
        service_name: mypy
mypy:release:
    extends: .release_job
    rules:
        - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "release/*"
          changes:
              - mypy/**
    variables:
        service_name: mypy
        version: $(cat .env | grep "MYPY_CONTAINER_VERSION" | cut -d"=" -f1)
