---
mypy:dockerfile:
    extends: .analyse_dockerfile
    rules:
        - changes:
              - mypy/Dockerfile
    variables:
        service_name: mypy

mypy:build:
    extends: .build_service
    needs:
        - job: mypy:dockerfile
          optional: true
    rules:
        - changes:
              - mypy/*
          when: always
        - changes:
              - mypy/setup-default.cfg
              - mypy/ci.yaml
          when: never
    variables:
        DOCKER_REPO: ${CI_REGISTRY_IMAGE}
        service_name: mypy

mypy:version:
    extends: .publish_version_master
    needs:
        - mypy:build
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - mypy/*
          variables:
              service_name: mypy
          when: always
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - mypy/setup-default.cfg
              - mypy/ci.yaml
          when: never

mypy:latest:
    extends: .publish_latest
    needs:
        - mypy:version
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - mypy/*
          variables:
              service_name: mypy
          when: always
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - mypy/setup-default.cfg
              - mypy/ci.yaml
          when: never
