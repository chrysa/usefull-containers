---
version: '3.8'

services:
    mypy:
        build:
            context: .
            cache_from:
                - python:3.8-alpine
                - ${PROJECT_NAME}/mypy
            dockerfile: Dockerfile
            labels:
                maintainer: ${MAINTAINER_NAME-} <${MAINTAINER_MAIL}>
                build_date: ${BUILD_DATE:-}
                commit_id: ${CI_COMMIT_SHA:-}
                vcs-url: ${CI_REPOSITORY_URL:-}
                vcs-ref: ${CI_COMMIT_SHA:-}
                departement: QA
                description: guideline checker for python projects
                version: ${MYPY_CONTAINER_VERSION}
        container_name: mypy
        image: ${PROJECT_NAME}/mypy:${MYPY_CONTAINER_VERSION}
        tty: true
        volumes:
            - .:/app
            - my-py-cache:.mypy_cache
        working_dir: /app
