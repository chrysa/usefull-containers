[metadata]
name = currents
long_description = file: README.md
long_description_content_type = text/markdown
url = git.ias.u-psud.fr/medocssa/currents
author = Anthony Greau
author_email = "Anthony Greau"
license = GPL-3.0
license_file = LICENSE
classifiers =
    Development Status :: 2 - Pre-Alpha
    Environment :: Console
    Intended Audience :: Developers
    License :: OSI Approved :: GNU General Public License v3 (GPLv3)
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Topic :: Scientific/Engineering :: Astronomy
keywords = Sun,maps
project_urls =
    Bug Tracker=anthony.greau@ias.u-psud.fr
    documentation=medocssa.io.ias.u-psud.fr/currents
    Source=git.ias.u-psud.fr/medocssa/currents

[options]
packages = find:
python_requires = >=3.9
include_package_data = true
setup_requires =
    setuptools>=56.2.0
test_suite = tests
tests_require =
    pytest==6.2.4
zip_safe = true

[aliases]
test = pytest

[bdist_wheel]
universal = true

[check]
metadata = true
restructuredtext = true
strict = true

[sdist]
formats = zip, gztar

[flake8]
ban-relative-imports = True
banned-modules =
    unittest.mock!=use mock.
    six.moves.urllib.parse!=use urlparse
    {python2to3}
benchmark = True
count = True
exclude = .git,__pycache__,build,dist,docs
format = pylint
hang-closing = False
ignore =
    E203 # for black
    W503 # for black
max-complexity = 15
max-line-length = 120
plugins = numpy.typing.mypy_plugin
select = B,C,E,F,W,T4,B9
statistics = True
max-doc-length = 200
mypy_config = ./setup.cfg

[mypy]
check_untyped_defs = True
disallow_any_decorated = False
disallow_any_expr = False
disallow_any_generics = False
disallow_incomplete_defs = True
disallow_any_unimported = False
disallow_subclassing_any = False
dump_type_stats = True
no_implicit_optional = True
no_implicit_reexport = True
no_incremental = False
no_strict_optional = True
pretty = True
python_version = 3.9
show_absolute_path = True
show_column_numbers = True
show_error_codes = True
show_error_context = True
show_traceback = True
warn_no_return = True
warn_redundant_casts = True
warn_return_any = False
warn_unreachable = True
warn_unused_configs = True
warn_unused_ignores = True

[mypy-src.*]
check_untyped_defs = True
disallow_untyped_calls = True
disallow_untyped_defs = True
warn_no_return = True

[mypy-tests.*]
check_untyped_defs = False
disallow_untyped_calls = False
disallow_untyped_defs = False

[pylint]
jobs = 0
max-args = 10
max-line-length = 120
max-module-lines = 300
min-similarity-lines = 10
persistent = yes
suggestion-mode = yes
ignore-imports = no
ignored-modules =
    alembic
    astropy
    flask
    flask_restx
    numpy
    pytest
    sqlalchemy
fail-under = 9
init-hook = 'sys.path.insert(0,"./src")'
ignored-classes = scoped_session
load-plugins =
    pylint_junit
    pylint_report.pylint_report
ignore =
    docs
ignore-patterns =
    src/database/alembic/
output-format = colorized
reports = no
score = yes

[tool:pytest]
addopts = --verbose --showlocals --strict-markers --benchmark-disable --color=yes --cov=src
console_output_style = progress
junit_duration_report = total
junit_family = xunit2
junit_log_passing_tests = True
junit_logging = no
junit_suite_name = currents
log_level = DEBUG
markers =
    api:
    api_endpoint:
    api_serializer:
    common:
    config:
    database:
    generator:
    portal:
    synchronizer:
    units:
mock_traceback_monkeypatch = True
mock_use_standalone_module = True
mocked-sessions = integration.configs.flask.flask_app_conf.db.session
mocked-engines = configs.database.DatabaseConfig.engine
python_classes = Test*
python_files = tests_*.py
testpaths =
    tests

[coverage:paths]
include =
    src/
    tests/
omit =
    docs/

[coverage:report]
exclude_lines =
    pragma: no cover
    pragma: nocover
    pragma: no-cover
    if __name__ == .__main__.:
fail_under = 85
ignore_errors = True
precision = 2
show_missing = True
skip_empty = True

[html]
directory = reports/coverage_html_report
title = currents coverage

[xml]
output = reports/coverage.xml

[coverage:run]
branch = True
parallel = True

[uwsgi]
callable = app
chdir = /app
module = integration.app
socket = /tmp/currents-portal.sock
http = :5000
chmod-socket = 660
