services:
  backend:
    build:
      context: ./backend
      target: production
    environment:
      BLUEPRINTS_DIR: /data/blueprints
      CORS_ORIGINS: '["http://localhost:5173"]'
    healthcheck:
      interval: 30s
      retries: 3
      # NOTE: keep this 2-element form so pre-commit yaml-sorter cannot reorder
      # the CMD prefix out of position. Single-string form is treated as
      # CMD-SHELL by Docker.
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      timeout: 5s
    ports:
    - 9009:8000
    volumes:
    - blueprints_data:/data/blueprints
  frontend:
    build:
      context: ./frontend
      target: production
    depends_on:
      backend:
        condition: service_healthy
    ports:
    - 9109:80
volumes:
  blueprints_data: null
