services:
  backend:
    build:
      context: ./backend
      target: production
    environment:
      BLUEPRINTS_DIR: /data/blueprints
      CORS_ORIGINS: '["http://localhost:5173"]'
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - -c
      - CMD
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')
      - python
      timeout: 5s
    ports:
    - 9009:8000
    volumes:
    - blueprints_data:/data/blueprints
  frontend:
    build:
      context: ./frontend
      target: production
    depends_on:
      backend:
        condition: service_healthy
    ports:
    - 9109:80
volumes:
  blueprints_data: null
