services:
  backend:
    build:
      context: ./backend
      target: production
    ports:
      - "8000:8000"
    volumes:
      - blueprints_data:/data/blueprints
    environment:
      BLUEPRINTS_DIR: /data/blueprints
      CORS_ORIGINS: '["http://localhost:5173"]'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  blueprints_data:
