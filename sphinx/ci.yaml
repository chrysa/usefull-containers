---
sphinx:dockerfile:
    extends: .analyse_dockerfile
    variables:
        service_name: sphinx

sphinx:build:
    extends: .build_service
    needs:
        - job: sphinx:dockerfile
          optional: true
    rules:
        - changes:
              - sphinx/docker-compose.yaml
              - sphinx/Dockerfile
    variables:
        service_name: sphinx

sphinx:version:
    extends: .publish_version
    needs:
        - sphinx:build
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $STAGGING_BRANCH
          changes:
              - sphinx/docker-compose.yaml
              - sphinx/Dockerfile
          variables:
              service_name: sphinx
              CI_REGISTRY_IMAGE: ${DOCKER_HUB_REPO}
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - sphinx/docker-compose.yaml
              - sphinx/Dockerfile
          variables:
              service_name: sphinx
              CI_REGISTRY_IMAGE: ${DOCKER_HUB_REPO}

sphinx:latest:
    extends: .publish_latest
    needs:
        - sphinx:version
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $STAGGING_BRANCH
          changes:
              - sphinx/docker-compose.yaml
              - sphinx/Dockerfile
          variables:
              service_name: sphinx
              CI_REGISTRY_IMAGE: ${DOCKER_HUB_REPO}
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - sphinx/docker-compose.yaml
              - sphinx/Dockerfile
          variables:
              service_name: sphinx
              CI_REGISTRY_IMAGE: ${DOCKER_HUB_REPO}
