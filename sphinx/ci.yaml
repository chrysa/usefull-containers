---
sphinx:dockerfile:
    extends: .analyse_dockerfile
    variables:
        service_name: sphinx
sphinx:
    extends: .build_service
    needs:
        - sphinx:dockerfile
    rules:
        - changes:
              - sphinx/**
    variables:
        service_name: sphinx
sphinx:version:
    extends: .publish_version
    needs:
        - sphinx
    rules:
        - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop"
          changes:
              - sphinx/Dockerfile
    variables:
        service_name: sphinx
sphinx:latest:
    extends: .publish_latest
    needs:
        - sphinx:version
    rules:
        - if: $CI_COMMIT_BRANCH == "master"
          changes:
              - sphinx/**
    variables:
        service_name: sphinx
sphinx:release:
    extends: .release_job
    rules:
        - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "release/*"
          changes:
              - sphinx/**
    variables:
        service_name: sphinx
        version: $(cat .env | grep "SPHINX_CONTAINER_VERSION" | cut -d"=" -f1)
