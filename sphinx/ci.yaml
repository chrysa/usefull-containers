---
sphinx:dockerfile:
    extends: .analyse_dockerfile
    rules:
        - changes:
              - sphinx/Dockerfile
    variables:
        service_name: sphinx

sphinx:build:
    extends: .build_service
    needs:
        - job: sphinx:dockerfile
          optional: true
    rules:
        - changes:
              - sphinx/*
          when: always
        - changes:
              - sphinx/ci.yaml
          when: never
    variables:
        DOCKER_REPO: ${CI_REGISTRY_IMAGE}
        service_name: sphinx

sphinx:version:
    extends: .publish_version_master
    needs:
        - sphinx:build
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - sphinx/*
          variables:
              service_name: sphinx
          when: always
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - sphinx/ci.yaml
          when: never

sphinx:latest:
    extends: .publish_latest
    needs:
        - sphinx:version
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - sphinx/*
          variables:
              service_name: sphinx
          when: always
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - sphinx/ci.yaml
          when: never
