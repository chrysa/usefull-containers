---
version: '3.8'

services:
    sphinx:
        build:
            context: .
            dockerfile: Dockerfile
            labels:
                maintainer: ${MAINTAINER_NAME-} <${MAINTAINER_MAIL}>
                build_date: ${BUILD_DATE:-}
                commit_id: ${CI_COMMIT_SHA:-}
                vcs-url: ${CI_REPOSITORY_URL:-}
                vcs-ref: ${CI_COMMIT_SHA:-}
                departement: documentation
                description: python documentation project
                version: ${SPHINX_CONTAINER_VERSION}
        container_name: sphinx
        image: ${DOCKER_REPO-local}/sphinx:${SPHINX_CONTAINER_VERSION}
        tty: true
        volumes:
            - .:/app
        working_dir: /app
