services:
  agent-test:
    build:
      context: ./agent
      target: deps
    command: 'sh -c "pytest tests/ -v --cov=sfm_agent --cov-report=term-missing --cov-report=xml
      --cov-fail-under=85"

      '
    volumes:
    - ./agent:/app
    working_dir: /app
  api-test:
    build:
      context: ./backend
      target: dev
    command: 'sh -c "pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml
      --cov-fail-under=85"

      '
    volumes:
    - ./backend:/app
    working_dir: /app
  frontend-lint:
    build:
      context: ./frontend
      target: deps
    command: sh -c "npm run lint"
    volumes:
    - ./frontend:/app
    - /app/node_modules
    working_dir: /app
  frontend-test:
    build:
      context: ./frontend
      target: deps
    command: sh -c "npm run test"
    volumes:
    - ./frontend:/app
    - /app/node_modules
    working_dir: /app
