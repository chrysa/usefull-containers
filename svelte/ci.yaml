---
svelte:dockerfile:
    extends: .analyse_dockerfile
    rules:
        - changes:
              - svelte/Dockerfile
    variables:
        service_name: svelte

svelte:build:
    extends: .build_service
    needs:
        - job: svelte:dockerfile
          optional: true
    rules:
        - changes:
              - svelte/*
          when: always
        - changes:
              - svelte/ci.yaml
          when: never
    variables:
        DOCKER_REPO: ${CI_REGISTRY_IMAGE}
        service_name: svelte

svelte:version:
    extends: .publish_version_master
    needs:
        - svelte:build
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - svelte/*
          variables:
              service_name: svelte
          when: always
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - svelte/ci.yaml
          when: never

svelte:latest:
    extends: .publish_latest
    needs:
        - svelte:version
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - svelte/*
          variables:
              service_name: svelte
          when: always
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_BUILD_REF_NAME == $CI_DEFAULT_BRANCH
          changes:
              - svelte/ci.yaml
          when: never
